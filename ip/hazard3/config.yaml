meta: 
  version: 3
  flow: Classic
  substituting_steps:
    # Save time during development
    # Enable for sign-off
    OpenROAD.IRDropReport: null
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.XOR: null
    Netgen.LVS: null
    Checker.LVS: null

DESIGN_NAME: soc

VERILOG_INCLUDE_DIRS:
- dir::../../src
- dir::../../src/hazard3/hdl

VERILOG_FILES:
- dir::../../src/soc.v
- dir::../../src/hazard3/hdl/hazard3_core.v
- dir::../../src/hazard3/hdl/hazard3_cpu_1port.v
- dir::../../src/hazard3/hdl/arith/hazard3_alu.v
- dir::../../src/hazard3/hdl/arith/hazard3_branchcmp.v
- dir::../../src/hazard3/hdl/arith/hazard3_mul_fast.v
- dir::../../src/hazard3/hdl/arith/hazard3_muldiv_seq.v
- dir::../../src/hazard3/hdl/arith/hazard3_onehot_encode.v
- dir::../../src/hazard3/hdl/arith/hazard3_onehot_priority.v
- dir::../../src/hazard3/hdl/arith/hazard3_onehot_priority_dynamic.v
- dir::../../src/hazard3/hdl/arith/hazard3_priority_encode.v
- dir::../../src/hazard3/hdl/arith/hazard3_shift_barrel.v
- dir::../../src/hazard3/hdl/hazard3_csr.v
- dir::../../src/hazard3/hdl/hazard3_decode.v
- dir::../../src/hazard3/hdl/hazard3_frontend.v
- dir::../../src/hazard3/hdl/hazard3_instr_decompress.v
- dir::../../src/hazard3/hdl/hazard3_irq_ctrl.v
- dir::../../src/hazard3/hdl/hazard3_pmp.v
- dir::../../src/hazard3/hdl/hazard3_power_ctrl.v
- dir::../../src/hazard3/hdl/hazard3_regfile_1w2r.v
- dir::../../src/hazard3/hdl/hazard3_triggers.v

DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS: 
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60

CELL_LIBS:
  '*_tt_025C_3v30':
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  '*_ff_n40C_3v60':
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib
  '*_ss_125C_3v00':
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib

FP_SIZING: "absolute"

pdk::gf180mcuD:
  # Routing
  RT_MAX_LAYER: Metal4
  # Width should be multiple of 0.56 (Metal2 pitch)
  # Height should be multiple of 0.56 (Metal3 pitch)
  # Standard cell row height: 3.92 (8 Metal3 track)
  DIE_AREA: [0, 0, 420.0, 840.0]
  PL_TARGET_DENSITY_PCT: 65

# this is a macro, leave room for power routing
PDN_MULTILAYER: false
PDN_EXTEND_TO: "boundary"

CLOCK_NET: clk
CLOCK_PORT: clk
CLOCK_PERIOD: 40 # 25 MHz

VDD_NETS: [VPWR]
GND_NETS: [VGND]

# remove design repair
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_CTS_RESIZER_TIMING: true

# save space
BOTTOM_MARGIN_MULT: 1
TOP_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

GRT_ALLOW_CONGESTION: true

# Add buffers
DESIGN_REPAIR_BUFFER_INPUT_PORTS: False
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: True

# Use the minimum length for pins
# that satisfies the minimum area constraint
IO_PIN_H_LENGTH: null
IO_PIN_V_LENGTH: null
